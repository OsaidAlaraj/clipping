# Runs on every push and pull request: secrets scan, backend lint + tests, web typecheck + tests + build.
# All vendors are fakes in CI (no keys are configured here and none are needed).
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Real errors only (syntax errors, undefined names, broken comparisons); style is not enforced.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: backend
          args: check --select E9,F63,F7,F82 --output-format github

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLIPPING_USE_FAKES: "1"
      AUTH_MODE: local
      FFMPEG_PATH: /usr/bin/ffmpeg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - name: System packages (FFmpeg with libass, Arabic and Latin fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-liberation fontconfig
          ffmpeg -hide_banner -filters | grep -E " (ass|subtitles) " || (echo "FFmpeg has no subtitles filter" && exit 1)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -p no:cacheprovider -q -n auto --junitxml=../test-results/backend.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: test-results/backend.xml
          retention-days: 14

  web:
    name: Web typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ci-ok:
    name: CI passed
    if: always()
    needs: [secrets, backend-lint, backend-tests, web]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"\|"result": "cancelled"' && exit 1 || echo "All checks passed"
